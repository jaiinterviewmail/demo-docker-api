name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: node:18

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017

    env:
      MONGO_URL: mongodb://mongo:27017/testdb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Start app
        run: node app.js &

      - name: Wait for app
        run: sleep 5

      - name: Test API
        run: curl --fail http://localhost:3000
